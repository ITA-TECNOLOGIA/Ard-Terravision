dataset_name: canteras_atmos

variables:

  indoor_temperature:
    semantic: instantaneous
  temperature:
    semantic: instantaneous
  apparent_temperature:
    semantic: instantaneous
  indoor_dew_point_temperature:
    semantic: instantaneous
  dew_point_temperature:
    semantic: instantaneous
  indoor_heat_index:
    semantic: instantaneous
  heat_index:
    semantic: instantaneous
  indoor_humidity:
    semantic: instantaneous
  humidity:
    semantic: instantaneous
  wind_gust_speed:
    semantic: max_signal
  wind_mean_speed:
    semantic: instantaneous
  wind_direction:
    semantic: circular
  air_pressure:
    semantic: instantaneous
  precipitation:
    semantic: cumulative
  evapotranspiration:
    semantic: cumulative
  precipitation_rate:
    semantic: instantaneous
  solar_radiation:
    semantic: instantaneous
  uv_index:
    semantic: instantaneous

resample:
  freq: "10min"

  default_by_semantic:
    instantaneous: mean
    cumulative: last
    max_signal: max
    circular: circular_mean
    state: first
    categorical: first

  override: {}


outliers:
  enabled: true
  write_flags: true
  window: 12
  threshold: 8.0
  noise_floor: 0.5

  by_semantic:
    instantaneous:
      enabled: true
    max_signal:
      enabled: true
    cumulative:
      enabled: false
    circular:
      enabled: false
    state:
      enabled: false
    categorical:
      enabled: false

  override:
    humedad:
      noise_floor: 2.0
    humedad_interior:
      noise_floor: 2.0
    rafaga_maxima_de_viento:
      noise_floor: 1.0
    velocidad_media_del_viento:
      noise_floor: 0.8


interpolation:
  enabled: true
  write_flags: true
  max_gap: "1h"

  by_semantic:
    instantaneous: linear
    max_signal: linear
    cumulative: forward_fill
    circular: forward_fill
    state: forward_fill
    categorical: forward_fill

  override: {}


features:
  enabled: true

  pipelines:
    - diff

  diff:
    suffix: "diff"
    variables:
      - temperature
      - humidity
      - air_pressure
      - wind_mean_speed
      - solar_radiation
      - uv_index

smoothing:
  enabled: true
  window: 6
  min_valid: 4

  by_semantic:
    instantaneous:
      enabled: true
      method: mean
    max_signal:
      method: median
    cumulative:
      enabled: false
    circular:
      enabled: false
    state:
      enabled: false
    categorical:
      enabled: false

  override: {}


normalization:
  enabled: true

  by_semantic:
    instantaneous: minmax
    max_signal: minmax
    cumulative: none
    circular: none
    state: none
    categorical: none

  override: {}